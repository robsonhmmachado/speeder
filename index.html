  .ibtn{pointer-events:auto;font:inherit;font-size:16px;font-weight:700;color:var(--ink);border:0;width:32px;height:28px;display:grid;place-items:center;cursor:pointer;padding:0}

  .card{max-width:340px;width:100%;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
  .card h1,.card h2{margin:0;font-weight:700;line-height:1.05;text-wrap:balance;text-shadow:2px 2px 0 var(--pink)}
  .card h1{font-size:30px}
  .card h2{font-size:28px}
  .sub{margin:0;font-size:14px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
  #hero{width:150px;height:90px;image-rendering:pixelated;image-rendering:crisp-edges}
  .how{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px;text-align:left;width:100%}
  .how li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center}
  .how .ico{display:grid;place-items:center;height:28px}
  .how .ico svg{width:24px;height:24px}
  .how b{font-weight:700}
  .big{font:inherit;font-size:21px;font-weight:700;color:#fff;background:var(--pink);border:0;padding:7px 28px;cursor:pointer;text-shadow:2px 2px 0 var(--ink);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 var(--pinkD)}
  .big:active{transform:translateY(2px)}
  .stats{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:18px;width:100%;max-width:220px;font-variant-numeric:tabular-nums;margin:2px 0 6px}
  .stats span:nth-child(even){text-align:right;font-weight:700}
  .note{margin:2px 0 0;font-size:14px;color:var(--mute)}
  @media (min-width:560px){
    #lobbyOv .card{max-width:620px;display:grid;grid-template-columns:1fr 1.25fr;gap:10px 24px;text-align:left;align-items:center}
    #lobbyOv .intro{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
    #lobbyOv .right{display:flex;flex-direction:column;gap:14px;align-items:center}
  }
  .intro,.right{display:flex;flex-direction:column;align-items:center;gap:10px}
  #rotateOv{display:none;z-index:10;background:#cdebfb}
  #rotateOv .card{gap:12px}
  .phone{width:44px;height:72px;border:4px solid var(--ink);border-radius:6px;background:#fff;position:relative;animation:turn 2.2s ease-in-out infinite}
  .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:4px;margin-left:-4px;background:var(--ink)}
  @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ #rotateOv{display:grid} }
  .fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;width:100%;max-width:220px}
  .fld input,#codeIn{font:inherit;font-size:17px;color:var(--ink);background:#fff;border:0;padding:4px 8px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);text-transform:none;letter-spacing:0;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
  .colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .colors button{width:24px;height:24px;border:0;cursor:pointer;padding:0;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
  .colors button[aria-checked="true"]{outline:3px solid var(--pinkD);outline-offset:3px}
  .roomrow{display:flex;align-items:center;gap:10px;width:100%;font-size:15px}
  .roomrow label{white-space:nowrap;font-weight:600}
  #codeIn{max-width:150px}
  .plist{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:5px;max-height:110px;overflow:auto;font-size:16px}
  .plist li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
  .dot{width:12px;height:12px;box-shadow:0 0 0 2px var(--ink)}
  .tag{font-size:13px;color:var(--mute)}
  .small{font-size:13px;line-height:1.35;text-align:center}
  .rank{list-style:none;margin:2px 0 6px;padding:0;width:100%;max-width:320px;display:grid;gap:6px;font-size:17px;font-variant-numeric:tabular-nums}
  .rank li{display:grid;grid-template-columns:30px 14px 1fr auto;gap:8px;align-items:center;text-align:left}
  .rank .pos{font-weight:700}
  .rank .me span:nth-child(3){font-weight:700}
  #resOv .card{max-width:380px}
  #count{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:96px;font-weight:700;color:#fff;text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
  #pos{min-width:62px;justify-content:center}
  .views{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .joinrow{display:flex;gap:10px;width:100%;max-width:300px;align-items:center}
  #joinIn{font:inherit;font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--ink);background:#fff;border:0;padding:4px 6px;width:100%;min-width:0;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);user-select:text;-webkit-user-select:text}
  .sec{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:#efe3fb;border:0;padding:6px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 0 -3px 0 #d6c3ef}

  .big:disabled,.sec:disabled{opacity:.55;cursor:default}
  .or{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
  .linkbtn{font:inherit;font-size:15px;color:var(--ink);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 4px}
  .msg{min-height:1.3em;margin:0;font-size:14px;line-height:1.35;color:#b0406a;text-align:center}

  .codebox .lbl{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

  .tip{font-size:13px;color:var(--mute);text-align:center;margin:0}

<body>

<canvas id="game"></canvas>
<div id="safe"></div>

<div id="hud">
  <div class="hud-l">
    <div class="chip pix" aria-label="Gotas de orvalho">
      <svg viewBox="0 0 5 6" shape-rendering="crispEdges"><path fill="#4a86b8" d="M2 0h1v1H2zM1 1h1v2H1zM3 1h1v2H3zM0 3h1v2H0zM4 3h1v2H4zM1 5h3v1H1z"/><path fill="#9fe0ff" d="M2 1h1v2H2zM1 3h3v2H1z"/><path fill="#fff" d="M2 3h1v1H2z"/></svg>
      <span id="dewTxt">0/0</span>
    </div>
    <div class="chip pix" id="timeTxt" aria-label="Tempo">0:00</div>
    <div class="chip pix" id="pos" aria-label="Sua posição">–</div>
  </div>
  <div class="hud-r">
    <button class="ibtn pix" id="sndBtn" aria-label="Ligar ou desligar som">♪</button>
    <button class="ibtn pix" id="homeBtn" aria-label="Voltar para a sala">⌂</button>
  </div>
</div>

<div id="hint" class="pix"></div>

<div id="count" hidden></div>

<div class="overlay" id="lobbyOv">
  <div class="card pix">
    <div class="intro">
      <canvas id="hero" width="30" height="18"></canvas>
      <h1>Aranhinha Saltitante</h1>
      <p class="sub">Corrida no Jardim do Orvalho</p>
      <label class="fld">Seu nome<input id="nameIn" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <div class="colors" id="colors" role="radiogroup" aria-label="Cor da aranha"></div>
    </div>
    <div class="right">
      <div class="views" id="viewMenu">
        <button class="big" id="createBtn">Criar sala</button>
        <span class="or">ou entre com o código</span>
        <div class="joinrow">
          <label class="sr" for="joinIn" style="position:absolute;left:-9999px">Código da sala</label>
          <input id="joinIn" maxlength="5" placeholder="ABC12" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
          <button class="sec" id="joinBtn">Entrar</button>
        </div>
        <p class="msg" id="menuMsg" role="status"></p>
        <div class="row">
          <button class="linkbtn" id="soloBtn">Treinar sozinho</button>
          <button class="sec" id="installBtn" hidden>Instalar app</button>
        </div>
        <p class="tip" id="iosTip" hidden>No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".</p>
      </div>
      <div class="views" id="viewRoom" hidden>
        <div class="codebox"><span class="lbl">Código da sala</span><span id="roomCode">-----</span></div>
        <div class="row"><button class="sec" id="copyBtn">Copiar</button><button class="sec" id="shareBtn" hidden>Convidar</button></div>
        <ul class="plist" id="plist"></ul>
        <p class="note small" id="roomMsg"></p>
        <button class="big" id="startBtn" hidden>Começar corrida</button>
        <button class="linkbtn" id="leaveBtn">Sair da sala</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="resOv" hidden>
  <div class="card pix">
    <h2 id="resTitle">Chegou!</h2>
    <p class="sub">Resultado da corrida</p>
    <ol class="rank" id="rank"></ol>
    <button class="big" id="againBtn">Voltar para a sala</button>
  </div>
</div>

<div class="overlay" id="rotateOv">
  <div class="card pix">
    <div class="phone" aria-hidden="true"></div>
    <h2>Gire o celular</h2>
    <p class="note">A aranhinha joga na horizontal</p>
  </div>
</div>

// ---------- física ----------
function moveX(dx){
  p.x+=dx;
  const t0=Math.floor(p.y/TS), t1=Math.floor((p.y+p.h-.001)/TS);
  if(dx>0){ const c=Math.floor((p.x+p.w-.001)/TS); for(let ty=t0;ty<=t1;ty++) if(solidAt(c,ty)){ p.x=c*TS-p.w; p.vx=0; return true; } }
  else if(dx<0){ const c=Math.floor(p.x/TS); for(let ty=t0;ty<=t1;ty++) if(solidAt(c,ty)){ p.x=(c+1)*TS; p.vx=0; return true; } }
  return false;
}
function moveY(dy){
  p.y+=dy;
  const t0=Math.floor(p.x/TS), t1=Math.floor((p.x+p.w-.001)/TS);
  if(dy>0){ const r=Math.floor((p.y+p.h-.001)/TS); let hit=null;
    for(let tx=t0;tx<=t1;tx++) if(solidAt(tx,r)){ const c=tileAt(tx,r); if(!hit||c==='m') hit=c==='.'?'#':c; }
    if(hit){ p.y=r*TS-p.h; p.vy=0; return hit; } }
  else if(dy<0){ const r=Math.floor(p.y/TS); for(let tx=t0;tx<=t1;tx++) if(solidAt(tx,r)){ p.y=(r+1)*TS; p.vy=0; return null; } }
  return null;
}
// lado com parede de musgo encostada (-1 esquerda, 1 direita, 0 nenhuma)
function mossSide(){
  const t0=Math.floor(p.y/TS), t1=Math.floor((p.y+p.h-.001)/TS);
  const r=Math.floor((p.x+p.w+.5)/TS), l=Math.floor((p.x-.5)/TS);
  let R=false,L=false;
  for(let ty=t0;ty<=t1;ty++){ if(tileAt(r,ty)==='v') R=true; if(tileAt(l,ty)==='v') L=true; }
  if(R&&p.x+p.w>=r*TS-.6) return 1;
  if(L&&p.x<=(l+1)*TS+.6) return -1;
  return 0;
}
function pressJump(){
  if(attached()){ releaseWeb(true); return; }
  if(p.climb){ const s=p.cside; p.climb=false; p.clock=.28; p.vx=-s*150; p.vy=-240; p.face=-s; p.sq=-.6;
    burst(p.x+5+s*5,p.y+5,5,['#fff',C.mossL],40,10,80); sfx.jump(); return; }
  if(p.ground||p.coy>0){ p.vy=-265; p.ground=false; p.coy=0; p.sq=-.7; dust(); sfx.jump(); }
  else p.jbuf=.14;
}
function findAnchor(dx,dy,cone){
  const cx=p.x+5, cy=p.y+5; let best=null, bestA=cone;
  for(const a of anchors){ const ax=a.x-cx, ay=a.y-cy, d=Math.hypot(ax,ay); if(d>WEBMAX||d<8) continue;
    const ang=Math.acos(clamp((ax*dx+ay*dy)/d,-1,1)); if(ang<bestA){ bestA=ang; best=a; } }
  return best;
}
function shootWeb(dx,dy){
  if(attached()) releaseWeb(false);
  const cx=p.x+5, cy=p.y+5, best=findAnchor(dx,dy,.42);
  if(best){ const d=Math.hypot(best.x-cx,best.y-cy); dx=(best.x-cx)/d; dy=(best.y-cy)/d; }
  web={state:'fly',x:cx,y:cy,dx,dy,dist:0,target:best};
  if(Math.abs(dx)>.2&&!p.climb) p.face=Math.sign(dx);
  sfx.web();
}
function attach(x,y,a){
  const cx=p.x+5, cy=p.y+5, L=Math.hypot(cx-x,cy-y);
  web.state='att'; web.ax=x; web.ay=y; web.len=L; web.goal=Math.max(24,L*.82);
  p.climb=false;
  if(a) a.pop=1; burst(x,y,5,['#fff','#f0e6ff'],50,0,60); sfx.stick();
}
function releaseWeb(boost){
  if(!web) return;
  if(web.state==='att'){ if(boost){ p.vx*=1.12; p.vy-=60; } web.x=web.ax; web.y=web.ay; }
  web.state='back';
}
function updateWeb(dt){
  if(!web) return;
  const cx=p.x+5, cy=p.y+5;
  if(web.state==='fly'){
    let step=780*dt;
    while(step>0){ const s=Math.min(2,step); step-=s;
      web.x+=web.dx*s; web.y+=web.dy*s; web.dist+=s;
      if(web.target){ if(Math.hypot(web.x-web.target.x,web.y-web.target.y)<3){ attach(web.target.x,web.target.y,web.target); return; } }
      else {
        for(const a of anchors) if(Math.hypot(web.x-a.x,web.y-a.y)<6){ attach(a.x,a.y,a); return; }
        const tx=Math.floor(web.x/TS), ty=Math.floor(web.y/TS);
        if(tx>=0&&tx<LW&&ty>=0&&ty<LH&&solidAt(tx,ty)){ if(web.y<cy+4) attach(web.x-web.dx,web.y-web.dy,null); else web.state='back'; return; }
      }
      if(web.dist>WEBMAX+4){ web.state='back'; return; }
    }
  } else if(web.state==='back'){
    const dx=cx-web.x, dy=cy-web.y, d=Math.hypot(dx,dy), s=900*dt;
    if(d<=s){ web=null; return; } web.x+=dx/d*s; web.y+=dy/d*s;
  }
}

function update(rdt){
  for(const q of parts){ q.x+=q.vx*rdt; q.y+=q.vy*rdt; q.vy+=q.g*rdt; q.life-=rdt; }
  if(parts.length) parts=parts.filter(q=>q.life>0);
  for(const m of shrooms) m.sq=Math.max(0,m.sq-rdt*4);
  for(const a of anchors) a.pop=Math.max(0,a.pop-rdt*3);
  if(fade>0) fade=Math.max(0,fade-rdt*2.5);
  p.blinkT-=rdt; if(p.blinkT< -.12) p.blinkT=2+Math.random()*3;
  if(state==='count'&&!portrait){
    const before=Math.ceil(countT); countT-=rdt; const now=Math.ceil(countT);
    if(countT<=0){ state='play'; time=0; showCount('Já!',700); sfx.go(); }
    else if(now!==before){ showCount(String(now)); sfx.tick(); }
  }
  if(state==='done'){ if(Math.random()<.3) burst(GOAL.x+1,GOAL.base-28,1,[C.pink,'#ffe066','#fff',C.lav],90,60,120); p.sq+=(0-p.sq)*Math.min(1,rdt*10); return; }
  if(state!=='play'||portrait) return;
  time+=rdt;
  // câmera lenta enquanto mira no ar
  const dt = (btn.aim&&!p.ground&&!p.climb) ? rdt*.45 : rdt;
  if(p.coy>0) p.coy-=dt; if(p.clock>0) p.clock-=dt; if(p.jbuf>0) p.jbuf-=dt;
  p.sq+=(0-p.sq)*Math.min(1,dt*10);
  const J=getJoy();
  updateWeb(dt);
  let att=attached();
  const side=mossSide();

  // escalada
  if(p.climb){
    if(att){ p.climb=false; }
    else if(!side){ const s=p.cside; p.climb=false; if(J.y<.3){ p.vy=-150; p.vx=s*80; } }
    else if(J.x*side<-.45){ p.climb=false; p.vx=-side*60; p.clock=.25; }
    else if(p.ground&&J.y>.3){ p.climb=false; }
  } else if(side&&!att&&p.clock<=0&&(J.x*side>.35||(J.y<-.5&&J.x*side>-.2))){
    p.climb=true; p.cside=side; p.vx=0; p.vy=0; sfx.grab();
  }

  if(p.climb){
    const s=p.cside, dir=Math.abs(J.y)>.25?J.y:(J.x*s>.3?-.85:0);
    p.vy=dir*65; p.vx=s*20; p.face=s; p.moving=Math.abs(dir)>.1;
  } else {
    p.vy+=G*dt;
    if(att){
      if(J.y<-.3) web.goal=Math.max(18,web.goal-60*dt*(-J.y));
      if(J.y>.3) web.goal=Math.min(WEBMAX,web.goal+60*dt*J.y);
      web.len+=(web.goal-web.len)*Math.min(1,dt*4);
      p.vx+=J.x*150*dt;
      const cx=p.x+5, cy=p.y+5, dx=cx-web.ax, dy=cy-web.ay, L=Math.hypot(dx,dy)||1, nx=dx/L, ny=dy/L;
      const vr=p.vx*nx+p.vy*ny;
      if(L>=web.len-.5&&vr>0){ p.vx-=nx*vr; p.vy-=ny*vr; }
    } else {
      const tgt=J.x*85, k=p.ground?14:4;
      if(p.ground||(J.x&&(Math.sign(J.x)!==Math.sign(p.vx)||Math.abs(p.vx)<Math.abs(tgt)))) p.vx+=(tgt-p.vx)*Math.min(1,dt*k);
      if(Math.abs(J.x)>.2) p.face=Math.sign(J.x);
    }
    p.moving=p.ground&&Math.abs(p.vx)>10;
  }
  p.vx=clamp(p.vx,-420,420); p.vy=clamp(p.vy,-470,470);
  const wasG=p.ground; p.ground=false;
  moveX(p.vx*dt);
  const impact=p.vy, hit=moveY(p.vy*dt);
  if(hit==='m'&&impact>60&&!p.climb){
    p.vy=p.jbuf>0?-440:-380; p.jbuf=0; p.coy=.12; p.sq=-.8;
    const tx=Math.floor((p.x+5)/TS); const m=shrooms.find(s=>tx===s.tx||tx===s.tx+1)||shrooms.find(s=>Math.abs(s.x+10-(p.x+5))<16); if(m) m.sq=1;
    burst(p.x+5,p.y+10,6,[C.pink,'#fff'],60,30,200); sfx.bounce();
  } else if(hit){
    p.ground=true; p.coy=.1;
    if(!wasG&&!p.climb){ p.sq=clamp(impact/400,.2,.8); if(impact>150) dust(); if(p.jbuf>0){ p.jbuf=0; pressJump(); } }
  }
  att=attached();
  if(att){
    const cx=p.x+5, cy=p.y+5, dx=cx-web.ax, dy=cy-web.ay, L=Math.hypot(dx,dy);
    if(L>web.len){ const k=web.len/L; moveX(web.ax+dx*k-cx); moveY(web.ay+dy*k-cy); }
  }

  // coletáveis, checkpoints, objetivo
  const cx=p.x+5, cy=p.y+5;
  for(const d of dews) if(!d.got&&Math.hypot(d.x-cx,d.y-cy)<9){ d.got=true; burst(d.x,d.y,8,['#9fe0ff','#fff'],70,20,120); sfx.dew(); updateHUD(true); }
  for(const c of checks) if(!c.on&&cx>=c.x-2&&cy<c.base+4&&cy>c.base-40){ c.on=true; lastCheck={x:c.x-5,y:c.base-10}; burst(c.x,c.base-10,10,[C.pink,'#ffe066','#fff'],70,30,150); sfx.check(); }
  if(Math.abs(cx-(GOAL.x+1))<12&&cy>GOAL.base-44&&cy<GOAL.base+2){ win(); }
  if(p.y>LH*TS-8){
    burst(cx,LH*TS-7,12,[C.water,'#fff',C.waterL],90,60,300); sfx.splash();
    resetPlayer(lastCheck); fade=1; snapCam();
  }
}

function win(){
  state='done'; finishMs=Math.round(time*1000); web=null; p.vx=0; p.vy=0; p.climb=false; btn.id=null; btn.aim=false; joy.id=null; sfx.win();
  lastSend=0; renderResults();
  setTimeout(()=>{ if(state==='done') resOv.hidden=false; },900);
}

// ---------- câmera ----------
function camTarget(){
  const lw=LW*TS, lh=LH*TS;
  let tx=p.x+5-vw*.4+p.vx*.3; tx=vw>=lw?(lw-vw)/2:clamp(tx,0,lw-vw);
  let ty=vh>=lh?lh-vh:clamp(p.y-vh*.5,0,lh-vh);
  return {tx,ty};
}
function snapCam(){ const t=camTarget(); cam.x=t.tx; cam.y=t.ty; }
function updateCamera(dt){ const t=camTarget(), k=1-Math.exp(-6*dt); cam.x+=(t.tx-cam.x)*k; cam.y+=(t.ty-cam.y)*k; }

// ---------- desenho ----------
function pline(gg,x0,y0,x1,y1){
  x0|=0;y0|=0;x1|=0;y1|=0;
  let dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1, err=dx+dy;
  for(let n=0;n<400;n++){ gg.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){err+=dy;x0+=sx;} if(e2<=dx){err+=dx;y0+=sy;} }
}
function legLine(gg,x0,y0,x1,y1,k){
  x0|=0;y0|=0;x1|=0;y1|=0; const pts=[];
  let dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1, err=dx+dy;
  for(let n=0;n<40;n++){ pts.push([x0,y0]); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){err+=dy;x0+=sx;} if(e2<=dx){err+=dx;y0+=sy;} }
  gg.fillStyle=C.ink; for(const [x,y] of pts){ gg.fillRect(x,y+1,1,1); gg.fillRect(x-1,y,1,1); gg.fillRect(x+1,y,1,1); }

function drawSpider(gg,x,y,face,mode,t,sq,blink,walk,sk){
  const K=SKINS[sk|0]||SKINS[0];

  const cx=x+5, cy=y+5, step=Math.floor(t*12);
  for(const s of [-1,1]) for(let i=0;i<3;i++){
    const ax=cx+s*(3+i), ay=cy+1; let kx,ky,fx,fy;
    if(mode==='ground'){ const lift=walk?((step+i+(s>0?1:0))%2):0; kx=cx+s*(9+i); ky=cy-1+i-lift; fx=cx+s*(8+i*2); fy=y+9-lift; }
    else if(mode==='swing'){ const w=Math.round(Math.sin(t*10+i*1.3+s)); kx=cx+s*(9+i); ky=cy-3+i; fx=cx+s*(10+i); fy=cy+1+i*2+w; }
    else { const w=Math.round(Math.sin(t*18+i*2+(s>0?1:0))*1.2); kx=cx+s*(9+i); ky=cy+i+w; fx=cx+s*(9+i); fy=cy+4+i+w; }
    legLine(gg,ax,ay,kx,ky,0); legLine(gg,kx,ky,fx,fy,1);
  }
  const img=face<0?K.L:K.R, w=K.R.width, h=K.R.height;
  const dw=Math.max(12,Math.round(w*(1+sq*.22))), dh=Math.max(10,Math.round(h*(1-sq*.22)));
  const dx=x-4+Math.round((w-dw)/2), dy=y-5+(h-dh)-(walk&&step%2?1:0);
  gg.drawImage(img,dx,dy,dw,dh);
  if(blink&&dw===w&&dh===h){
    const eyes=face<0?[2,7]:[8,13];
    for(const ex of eyes){ gg.fillStyle=K.f; gg.fillRect(dx+ex,dy+7,4,4); gg.fillStyle=C.ink; gg.fillRect(dx+ex,dy+9,4,1); }
  }
}
const clouds=[{x:20,y:18,w:26},{x:120,y:34,w:18},{x:210,y:12,w:30},{x:300,y:40,w:22},{x:380,y:22,w:16},{x:470,y:30,w:24}];

function ring(x,y,r,fill,stroke,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); } }
function drawControls(){

// ---- envio periódico (chamado a cada quadro)
function netTick(now){
  const rate=(state==='count'||state==='play')?50:200;
  if(now-lastSend<rate) return; lastSend=now;
  if(mode==='host'){
    for(const [id,c] of conns){ const o=others.get(id); if((o&&now-o.seen>7000)||(!o&&!c.open)){ conns.delete(id); try{ c.close(); }catch(e){} if(o){ others.delete(id); toast(o.n+' saiu da sala'); } renderRoom(); if(state==='done') renderResults(); } }
    const list=[myState()]; for(const [id,o] of others) list.push({id,n:o.n,k:o.k,st:o.st,rid:o.rid,x:o.x,y:o.y,f:o.f,m:o.m,c:o.c,mv:o.mv,w:o.w,ft:o.ft});
    const msg={t:'pos',list};
    for(const c of conns.values()) if(c.open) try{ c.send(msg); }catch(e){}
  } else if(mode==='client'&&hostConn&&hostConn.open){
    try{ hostConn.send(Object.assign({t:'st'},myState())); }catch(e){}
  }
}

  tries=tries||0;
  if(typeof Peer==='undefined'){ menuStatus('O modo online não carregou. Confira a internet e abra de novo.'); return; }
  closeNet(); busy(true); menuStatus('Criando sala…');
  const code=genCode(), pr=new Peer(PREFIX+code,PEER_OPTS); peer=pr;
  pr.on('open',id=>{ if(peer!==pr) return; busy(false); mode='host'; myId=id; roomCode=code; showRoom(); });
  pr.on('connection',c=>{
    c.on('open',()=>{
      if(peer!==pr) return c.close();
      if(conns.size>=MAX_PLAYERS-1){ try{ c.send({t:'full'}); }catch(e){} setTimeout(()=>c.close(),400); return; }
      conns.set(c.peer,c);
    });
    c.on('data',d=>{
      if(!d||typeof d!=='object'||!conns.has(c.peer)) return;
      if(d.t==='hello'){ upsert(c.peer,{n:d.n,k:d.k,st:'lobby'}); renderRoom(); toast((cleanName(d.n)||'Aranha')+' entrou na sala'); }
      else if(d.t==='st'){ upsert(c.peer,d); if(!lobbyOv.hidden) renderRoom(); if(state==='done') renderResults(); }
    });
    c.on('close',()=>{ if(conns.delete(c.peer)){ const o=others.get(c.peer); others.delete(c.peer); if(o) toast(o.n+' saiu da sala'); renderRoom(); if(state==='done') renderResults(); } });
    c.on('error',()=>{});
  });
  pr.on('disconnected',()=>{ if(peer===pr&&!pr.destroyed) setTimeout(()=>{ try{ if(peer===pr&&pr.disconnected&&!pr.destroyed) pr.reconnect(); }catch(e){} },1500); });
  pr.on('error',e=>{
    if(peer!==pr) return;
    if(e.type==='unavailable-id'&&tries<4){ pr.destroy(); peer=null; createRoom(tries+1); return; }
    if(e.type==='peer-unavailable') return;          // cliente que sumiu; ignora
    if(mode==='host'&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed')) return; // quem já está conectado continua jogando
    netFail(e);
  });
}
function hostStart(){
  if(mode!=='host') return;
  const r=genRid();
  for(const c of conns.values()) if(c.open) try{ c.send({t:'start',rid:r}); }catch(e){}
  beginRace(r);
}

// ---- convidado
function joinRoom(code){
  code=cleanCode(code);
  if(code.length!==5){ menuStatus('O código da sala tem 5 letras ou números.'); joinIn.focus(); return; }
  if(typeof Peer==='undefined'){ menuStatus('O modo online não carregou. Confira a internet e abra de novo.'); return; }
  closeNet(); busy(true); menuStatus('Entrando na sala '+code+'…');
  const pr=new Peer(PEER_OPTS); peer=pr;
  pr.on('open',id=>{
    if(peer!==pr) return; myId=id;
    const c=pr.connect(PREFIX+code,{reliable:true}); hostConn=c;
    const to=setTimeout(()=>{ if(hostConn===c&&!c.open) netFail({type:'peer-unavailable'}); },9000);
    c.on('open',()=>{ clearTimeout(to); if(hostConn!==c) return; busy(false); mode='client'; roomCode=code; try{ c.send({t:'hello',n:me.name,k:me.col}); }catch(e){} showRoom(); });
    c.on('data',d=>{
      if(hostConn!==c||!d||typeof d!=='object') return;
      if(d.t==='pos'&&Array.isArray(d.list)){
        const alive=new Set();
        for(const it of d.list.slice(0,MAX_PLAYERS)){ if(!it||typeof it!=='object'||it.id===myId) continue; const id=String(it.id).slice(0,64); alive.add(id); upsert(id,it); }
        for(const id of [...others.keys()]) if(!alive.has(id)) others.delete(id);
        if(!lobbyOv.hidden) renderRoom(); if(state==='done') renderResults();
      } else if(d.t==='start'&&typeof d.rid==='string') beginRace(d.rid.slice(0,20));
      else if(d.t==='full') netFail({type:'full'});
    });
    c.on('close',()=>{ if(hostConn===c){ clearTimeout(to); if(mode==='client') hostLeft(); } });
    c.on('error',()=>{});
  });
  pr.on('error',e=>{ if(peer!==pr) return; if(mode==='client'&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed')) return; netFail(e); });
}

function closeNet(){
  try{ if(hostConn) hostConn.close(); }catch(e){}
  for(const c of conns.values()) try{ c.close(); }catch(e){}
  conns.clear(); hostConn=null;
  if(peer){ const pr=peer; peer=null; try{ pr.destroy(); }catch(e){} }
  others.clear(); roomCode=null; myId='eu';
  if(mode==='host'||mode==='client') mode='menu';
}
function netFail(e){
  const t=e&&e.type;
  const msg=t==='peer-unavailable'?'Sala não encontrada. Confira o código ou peça para o host criar de novo.'
    :t==='full'?'Essa sala está cheia (até '+MAX_PLAYERS+' aranhas).'
    :t==='browser-incompatible'?'Este navegador não tem suporte ao modo online. Tente o Chrome ou o Safari atualizados.'
    :(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')?'Sem conexão com o servidor de salas. Verifique a internet e tente de novo.'
    :'Não foi possível conectar'+(t?' ('+t+')':'')+'. Tente de novo.';
  closeNet(); busy(false); toMenu(); menuStatus(msg);
}
function hostLeft(){ closeNet(); toMenu(); menuStatus('O host fechou a sala.'); }
function busy(b){ createBtn.disabled=b; joinBtn.disabled=b; }
function menuStatus(t){ menuMsg.textContent=t||''; }

// ---- telas
function showLobbyOverlay(){
  state='lobby'; rid=null; finishMs=null; web=null;
  resOv.hidden=true; countEl.hidden=true; lobbyOv.hidden=false; document.body.classList.add('inlobby');
  resetGame(); joy.id=null; btn.id=null; btn.aim=false; releaseWake();
}
function toMenu(){ if(mode==='solo') mode='menu'; showLobbyOverlay(); viewMenu.hidden=false; viewRoom.hidden=true; }
function showRoom(){ showLobbyOverlay(); viewMenu.hidden=true; viewRoom.hidden=false; menuStatus(''); renderRoom(); }
function backToLobby(){ if(mode==='host'||mode==='client') showRoom(); else toMenu(); }

function beginRace(r){
  rid=r; finishMs=null;
  resetGame(); state='count'; countT=3.2;
  lobbyOv.hidden=true; resOv.hidden=true; document.body.classList.remove('inlobby'); showCount('3'); sfx.tick();
  joy.id=null; btn.id=null; btn.aim=false; lastSend=0; requestWake();
}

function raceList(){
  const L=[];
  if(rid) L.push({me:true,n:me.name,k:me.col,x:p.x,st:state==='done'?'done':'race',ft:finishMs});
  for(const o of others.values()) if(rid&&o.rid===rid&&(o.st==='race'||o.st==='done')) L.push({me:false,n:o.n,k:o.k,x:o.x,st:o.st,ft:o.ft});
  L.sort((a,b)=>(a.st==='done'&&b.st==='done')?(a.ft-b.ft):a.st==='done'?-1:b.st==='done'?1:(b.x-a.x));
  return L;
}

function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function dot(k){ const d=el('span','dot'); d.style.background=SKINS[k].a; return d; }

function renderRoom(){
  if(viewRoom.hidden) return;
  roomCodeEl.textContent=roomCode||'-----';
  const list=[{me:true,n:me.name,k:me.col,st:'lobby',host:mode==='host'}].concat([...others.entries()].map(([id,o])=>Object.assign({host:mode==='client'&&id===PREFIX+roomCode},o)));
  plistEl.replaceChildren(...list.map(q=>{
    const li=el('li'); li.append(dot(q.k), el('span',null,(q.n||'Aranha')+(q.host?' ★':'')),
      el('span','tag',q.me?'você':q.st==='race'?'correndo':q.st==='done'?'terminou':'pronta'));
    return li;
  }));
  const n=others.size, running=[...others.values()].some(o=>o.st==='race');
  if(mode==='host'){
    startBtn.hidden=false;
    roomMsg.textContent=n===0?'Passe o código para seus amigos. Eles tocam em "Entrar" e digitam ele.':running?'Ainda tem gente correndo. Você pode começar outra corrida quando quiser.':n+(n===1?' amiga na sala. ':' amigas na sala. ')+'Quando todo mundo estiver pronto, comece!';
    startBtn.textContent=n?'Começar corrida':'Começar sozinho';
  } else {
    startBtn.hidden=true;
    roomMsg.textContent=running?'Tem uma corrida rolando. Você entra na próxima largada.':'Esperando o host (★) começar a corrida…';
  }
}

function renderResults(){
  const L=raceList();
  rankEl.replaceChildren(...L.map((q,i)=>{
    const li=el('li',q.me?'me':null);
    li.append(el('span','pos',q.st==='done'?(i+1)+'º':'…'), dot(q.k), el('span',null,(q.n||'Aranha')+(q.me?' (você)':'')), el('span','tag',q.st==='done'?fmtMs(q.ft):'correndo'));
    return li;
  }));
  const pos=L.findIndex(q=>q.me)+1;
  resTitle.textContent=L.length<2?'Chegou em '+fmtMs(finishMs||0)+'!':pos===1?'Você venceu!':'Você chegou em '+pos+'º';
  againBtn.textContent=mode==='solo'||mode==='menu'?'Voltar ao menu':'Voltar para a sala';
}

// ---- outras aranhas na pista
function drawOthers(cx,cy){
  for(const o of others.values()){
    if(!rid||o.rid!==rid||(o.st!=='race'&&o.st!=='done')) continue;
    const x=Math.round(o.rx-cx), y=Math.round(o.ry-cy); if(x<-30||x>vw+30) continue;
    if(o.w){ g.fillStyle='#8b78a6'; pline(g,x+5,y+6,o.w[0]-cx,o.w[1]-cy+1); g.fillStyle='#ffffff'; pline(g,x+5,y+5,o.w[0]-cx,o.w[1]-cy); }
    if(o.m==='c'){
      tg.clearRect(0,0,40,40); drawSpider(tg,15,15,o.c,'ground',T+o.ph,0,false,o.mv,o.k);
      g.save(); g.translate(x+5,y+5); g.rotate(-o.c*Math.PI/2); g.drawImage(TMP,-20,-20); g.restore();
    } else drawSpider(g,x,y,o.f,o.m==='s'?'swing':o.m==='g'?'ground':'air',T+o.ph,0,false,o.m==='g'&&o.mv,o.k);
  }
}
function drawNames(){
  ctx.save(); ctx.scale(dpr,dpr);
  ctx.font='600 12px "Pixelify Sans", ui-monospace, monospace'; ctx.textAlign='center'; ctx.lineJoin='round';
  for(const o of others.values()){
    if(!rid||o.rid!==rid||(o.st!=='race'&&o.st!=='done')) continue;
    const sx=(o.rx+5-cam.x)*scale, sy=(o.ry-9-cam.y)*scale; if(sx<-60||sx>W+60) continue;
    ctx.lineWidth=4; ctx.strokeStyle='#3b2a4a'; ctx.strokeText(o.n,sx,sy); ctx.fillStyle=SKINS[o.k].A; ctx.fillText(o.n,sx,sy);
  }
  ctx.restore();
}
function drawRaceBar(){
  const L=raceList(); if(L.length<2) return;
  const w=Math.min(240,W-470); if(w<80) return;
  const x0=W/2-w/2, y=safe.t+27;
  ctx.save(); ctx.scale(dpr,dpr);
  ctx.fillStyle='rgba(59,42,74,.55)'; ctx.fillRect(x0,y-2,w,4);
  ctx.fillStyle='#ffd44d'; ctx.strokeStyle='#3b2a4a'; ctx.lineWidth=2; ctx.fillRect(x0+w-3,y-9,6,18); ctx.strokeRect(x0+w-3,y-9,6,18);
  const ord=L.slice().sort((a,b)=>a.me-b.me);
  for(const q of ord){ const f=q.st==='done'?1:clamp(q.x/GOAL.x,0,1); ring(x0+f*w,y,q.me?8:6,SKINS[q.k].a,'#3b2a4a',q.me?3:2); }
  ctx.restore();
}

// ---- tela sempre ligada durante a corrida
async function requestWake(){ try{ if('wakeLock' in navigator&&!wakeLock) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){ wakeLock=null; } }
function releaseWake(){ try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&(state==='count'||state==='play')){ wakeLock=null; requestWake(); } });

function setupLobby(){
  me.name=cleanName(store.get('aranha-nome'))||('Aranha '+(10+Math.floor(Math.random()*90)));
  me.col=clamp(parseInt(store.get('aranha-cor')||'0',10)||0,0,SKINS.length-1);
  nameIn.value=me.name;
  SKINS.forEach((k,i)=>{
    const b=el('button'); b.type='button'; b.setAttribute('role','radio'); b.setAttribute('aria-label',k.nome); b.style.background=k.a;
    b.setAttribute('aria-checked',String(i===me.col));
    b.addEventListener('click',()=>{ me.col=i; store.set('aranha-cor',String(i)); [...colorsEl.children].forEach((c,j)=>c.setAttribute('aria-checked',String(j===i))); renderRoom(); });
    colorsEl.append(b);
  });
  nameIn.addEventListener('input',()=>{ me.name=cleanName(nameIn.value)||'Aranha'; store.set('aranha-nome',me.name); renderRoom(); });
  const q=new URLSearchParams(location.search).get('sala'); if(q) joinIn.value=cleanCode(q);
  joinIn.addEventListener('input',()=>{ const c=cleanCode(joinIn.value); if(c!==joinIn.value) joinIn.value=c; });
  joinIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); joinRoom(joinIn.value); } });
  document.body.classList.add('inlobby'); viewMenu.hidden=false; viewRoom.hidden=true;
  if(q) menuStatus('Você recebeu um convite. Toque em "Entrar" para ir para a sala '+cleanCode(q)+'.');
}

// ---------- botões ----------
function tryLandscape(){ try{ const d=document.documentElement; if(d.requestFullscreen&&!document.fullscreenElement&&!matchMedia('(display-mode: fullscreen)').matches){ d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{}); } else if(screen.orientation&&screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); } }catch(e){} }
createBtn.addEventListener('click',()=>{ initAudio(); createRoom(); });
joinBtn.addEventListener('click',()=>{ initAudio(); joinRoom(joinIn.value); });
document.getElementById('soloBtn').addEventListener('click',()=>{ initAudio(); tryLandscape(); closeNet(); mode='solo'; beginRace(genRid()); });
startBtn.addEventListener('click',()=>{ initAudio(); tryLandscape(); hostStart(); });
document.getElementById('leaveBtn').addEventListener('click',()=>{ closeNet(); toMenu(); menuStatus(''); });
againBtn.addEventListener('click',backToLobby);
document.getElementById('homeBtn').addEventListener('click',()=>{ if(state!=='lobby') backToLobby(); });
copyBtn.addEventListener('click',()=>{
  const t=roomCode||''; const done=()=>{ copyBtn.textContent='Copiado!'; setTimeout(()=>{ copyBtn.textContent='Copiar'; },1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>{});
});
if(navigator.share){ shareBtn.hidden=false; shareBtn.addEventListener('click',()=>{
  const url=location.origin+location.pathname+'?sala='+roomCode;
  navigator.share({title:'Aranhinha Saltitante',text:'Bora correr de aranha? Sala '+roomCode,url}).catch(()=>{});
}); }
document.addEventListener('pointerdown',()=>initAudio());
const sndBtn=document.getElementById('sndBtn');
sndBtn.addEventListener('click',()=>{ initAudio(); soundOn=!soundOn; sndBtn.classList.toggle('off',!soundOn); });

// ---------- PWA: instalar e funcionar offline ----------
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; installBtn.hidden=false; });
installBtn.addEventListener('click',async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; installBtn.hidden=true; });
addEventListener('appinstalled',()=>{ installBtn.hidden=true; });
const standalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone) iosTip.hidden=false;
if('serviceWorker' in navigator&&location.protocol!=='file:') addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });

// ---------- laço ----------
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt; acc+=dt;
  while(acc>=STEP){ update(STEP); acc-=STEP; }
  updateCamera(dt); render(); updateHUD(false);
  for(const o of others.values()){ if(Math.hypot(o.x-o.rx,o.y-o.ry)>80){ o.rx=o.x; o.ry=o.y; } else { o.rx+=(o.x-o.rx)*Math.min(1,dt*14); o.ry+=(o.y-o.ry)*Math.min(1,dt*14); } }
  netTick(now);
  if(!lobbyOv.hidden) drawHero();
  requestAnimationFrame(frame);
}
resize(); resetPlayer(SPAWN); p.ground=true; snapCam(); setupLobby(); updateHUD(true);
requestAnimationFrame(frame);
})();
</script>
